name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Flutter Xcode Project Files
        run: |
          # Run flutter build to generate Generated.xcconfig, Flutter.framework,
          # and run pod install — but ignore post-build team validation error
          flutter build ios --release --no-codesign || true

      - name: Verify Xcode workspace exists
        run: |
          ls ios/Runner.xcworkspace
          echo "Workspace found, proceeding with xcodebuild"

      - name: Build with xcodebuild (Full Codesign Bypass)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build/ios/DerivedData \
            build

      - name: Locate and Copy Runner.app
        run: |
          APP_PATH=$(find build/ios/DerivedData -name "Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ios/iphoneos
          cp -R "$APP_PATH" build/ios/iphoneos/Runner.app

      - name: Package App and Clean Signatures/Headers
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/

          # Clean up any existing _CodeSignature folders in the main app and nested frameworks
          echo "=== Removing pre-existing _CodeSignature metadata ==="
          rm -rf Payload/Runner.app/_CodeSignature
          if [ -d "Payload/Runner.app/Frameworks" ]; then
            find Payload/Runner.app/Frameworks -name "_CodeSignature" -type d -exec rm -rf {} +
          fi

          # Strip Headers, PrivateHeaders, and Modules from embedded frameworks to prevent ldid crash
          if [ -d "Payload/Runner.app/Frameworks" ]; then
            echo "=== Stripping Headers and Modules from frameworks ==="
            find Payload/Runner.app/Frameworks -name "Headers" -type d -exec rm -rf {} +
            find Payload/Runner.app/Frameworks -name "PrivateHeaders" -type d -exec rm -rf {} +
            find Payload/Runner.app/Frameworks -name "Modules" -type d -exec rm -rf {} +
          fi

          echo "App bundle cleaned successfully."
          mkdir -p build/ios/ipa
          zip -r build/ios/ipa/PrivateCinema.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-cinema-unsigned-ipa
          path: build/ios/ipa/PrivateCinema.ipa
          retention-days: 7
