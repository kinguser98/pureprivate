name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build iOS IPA (Unsigned)
        run: |
          mkdir -p build/ios/ipa
          flutter build ipa --release --no-codesign
          
          # Rename the generated IPA to PrivateCinema.ipa
          mv build/ios/ipa/*.ipa build/ios/ipa/PrivateCinema.ipa
        continue-on-error: true

      - name: Fallback to manual clean Payload packaging if build ipa failed
        run: |
          if [ ! -f build/ios/ipa/PrivateCinema.ipa ]; then
            echo "flutter build ipa failed or did not produce an IPA, falling back to flutter build ios..."
            flutter build ios --release --no-codesign
            
            mkdir -p Payload
            cp -R build/ios/iphoneos/Runner.app Payload/
            
            mkdir -p build/ios/ipa
            zip -r build/ios/ipa/PrivateCinema.ipa Payload
          else
            echo "Successfully generated IPA using flutter build ipa."
          fi

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-cinema-unsigned-ipa
          path: build/ios/ipa/PrivateCinema.ipa
          retention-days: 7
