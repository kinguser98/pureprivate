name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build iOS Project (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package App into IPA Payload
        run: |
          mkdir -p Payload
          
          # Diagnostics: Print all compiled frameworks in the build directory
          echo "=== SEARCHING FOR ALL COMPILED FRAMEWORKS ==="
          find build -name "*.framework"
          
          # Ensure the Frameworks folder exists inside Runner.app
          mkdir -p build/ios/iphoneos/Runner.app/Frameworks
          
          # Find and copy all compiled dynamic frameworks recursively to Runner.app/Frameworks
          find build/ios -name "*.framework" -not -path "*/Runner.app/*" -exec cp -R {} build/ios/iphoneos/Runner.app/Frameworks/ \;
          
          # Diagnostics: Print what was successfully copied into the app
          echo "=== FILES COPIED TO RUNNER.APP/FRAMEWORKS ==="
          ls -la build/ios/iphoneos/Runner.app/Frameworks/
          
          # Move Runner.app into the Payload folder and compress it as a ZIP renamed to .ipa
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r PrivateCinema.ipa Payload
          mkdir -p build/ios/ipa
          mv PrivateCinema.ipa build/ios/ipa/PrivateCinema.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-cinema-unsigned-ipa
          path: build/ios/ipa/PrivateCinema.ipa
          retention-days: 7
