name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build with xcodebuild archive (full codesign bypass)
        # We skip `flutter build ios` entirely because Flutter 3.44+ deletes the compiled
        # binary during its post-build "Development Team" validation cleanup.
        # xcodebuild runs Flutter's embedded Xcode build scripts (xcode_backend.sh) directly,
        # which compile Dart and embed the Flutter framework — without Flutter's cleanup step.
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tail -80

      - name: Extract and package Runner.app into IPA
        run: |
          ARCHIVE="build/ios/archive/Runner.xcarchive"
          APP_PATH="$ARCHIVE/Products/Applications/Runner.app"

          echo "=== Archive contents ==="
          find "$ARCHIVE" -maxdepth 4 -type d 2>/dev/null || true

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found in xcarchive!"
            exit 1
          fi

          echo "=== Runner.app contents ==="
          ls -lah "$APP_PATH"
          ls -lah "$APP_PATH/Runner" 2>/dev/null && echo "Binary found!" || echo "WARNING: No binary!"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Clean _CodeSignature to allow LiveContainer installation
          rm -rf Payload/Runner.app/_CodeSignature
          if [ -d "Payload/Runner.app/Frameworks" ]; then
            find Payload/Runner.app/Frameworks -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
            find Payload/Runner.app/Frameworks -name "Headers" -type d -exec rm -rf {} + 2>/dev/null || true
            find Payload/Runner.app/Frameworks -name "PrivateHeaders" -type d -exec rm -rf {} + 2>/dev/null || true
            find Payload/Runner.app/Frameworks -name "Modules" -type d -exec rm -rf {} + 2>/dev/null || true
          fi

          zip -r PrivateCinema.ipa Payload/
          echo "=== IPA size ==="
          ls -lh PrivateCinema.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-cinema-unsigned-ipa
          path: PrivateCinema.ipa
          retention-days: 7
