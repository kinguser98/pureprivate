name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (allow codesign warning)
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee flutter_build.log
          BUILD_EXIT=$?
          set -e
          echo "--- Flutter build exit code: $BUILD_EXIT ---"

          # build/ios/Release-iphoneos/Runner.app is INCOMPLETE — only resource bundles, no binary.
          # The REAL compiled Runner.app (binary + frameworks) is in Xcode's DerivedData.
          echo "=== Searching DerivedData for complete Runner.app ==="
          find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | grep "Release-iphoneos" | grep -v dSYM || true

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | grep "Release-iphoneos" | grep -v dSYM | head -1)

          if [ -n "$APP_PATH" ] && [ -f "$APP_PATH/Runner" ]; then
            echo "SUCCESS: Complete Runner.app found at $APP_PATH"
            ls -lah "$APP_PATH/Runner"
          else
            echo "DerivedData app not found or missing binary. Dumping last 30 lines:"
            tail -30 flutter_build.log
            exit 1
          fi

      - name: Package Runner.app into IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | grep "Release-iphoneos" | grep -v dSYM | head -1)
          echo "Packaging: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Clean _CodeSignature to prevent ldid issues in LiveContainer
          rm -rf Payload/Runner.app/_CodeSignature
          if [ -d "Payload/Runner.app/Frameworks" ]; then
            find Payload/Runner.app/Frameworks -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
            find Payload/Runner.app/Frameworks -name "Headers" -type d -exec rm -rf {} + 2>/dev/null || true
            find Payload/Runner.app/Frameworks -name "PrivateHeaders" -type d -exec rm -rf {} + 2>/dev/null || true
            find Payload/Runner.app/Frameworks -name "Modules" -type d -exec rm -rf {} + 2>/dev/null || true
          fi

          zip -r PrivateCinema.ipa Payload/
          echo "IPA created successfully:"
          ls -lh PrivateCinema.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-cinema-unsigned-ipa
          path: PrivateCinema.ipa
          retention-days: 7
