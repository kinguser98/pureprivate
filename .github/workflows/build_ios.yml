name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build iOS Project (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package App and Strip Headers/Modules
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          
          # Strip Headers, PrivateHeaders, and Modules from embedded frameworks to prevent ldid crash
          if [ -d "Payload/Runner.app/Frameworks" ]; then
            echo "=== Stripping Headers and Modules from frameworks ==="
            find Payload/Runner.app/Frameworks -name "Headers" -type d -exec rm -rf {} +
            find Payload/Runner.app/Frameworks -name "PrivateHeaders" -type d -exec rm -rf {} +
            find Payload/Runner.app/Frameworks -name "Modules" -type d -exec rm -rf {} +
            echo "Embedded frameworks cleaned successfully."
          fi
          
          mkdir -p build/ios/ipa
          zip -r build/ios/ipa/PrivateCinema.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-cinema-unsigned-ipa
          path: build/ios/ipa/PrivateCinema.ipa
          retention-days: 7
