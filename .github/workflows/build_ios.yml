name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App
        run: |
          set +o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee flutter_build.log || true

      - name: Locate Runner binary (diagnostic)
        run: |
          echo "=== All Runner.app directories in build/ ==="
          find build -name "Runner.app" -type d 2>/dev/null | grep -v dSYM || echo "None in build/"

          echo "=== All Runner.app directories in DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | grep -v dSYM || echo "None in DerivedData"

          echo "=== Searching for Runner binary file anywhere ==="
          find build ~/Library/Developer/Xcode/DerivedData -name "Runner" -type f 2>/dev/null | head -20 || echo "No Runner binary found"

          echo "=== Top-level build directory structure ==="
          find build -maxdepth 5 -type d 2>/dev/null | head -80 || echo "build dir empty"

          echo "=== Finding any .app with executable inside ==="
          find build ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | grep -v dSYM | while read app; do
            echo "--- $app ---"
            ls "$app/" 2>/dev/null | head -5
          done

      - name: Package Runner.app into IPA
        run: |
          # Find the first Runner.app that actually contains a compiled Runner binary
          APP_PATH=""
          while IFS= read -r candidate; do
            if [ -f "$candidate/Runner" ]; then
              APP_PATH="$candidate"
              echo "Found complete app at: $APP_PATH"
              break
            fi
          done < <(find build ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | grep -v dSYM)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No Runner.app with compiled binary found. Check diagnostic output above."
            exit 1
          fi

          ls -lah "$APP_PATH/Runner"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          rm -rf Payload/Runner.app/_CodeSignature
          if [ -d "Payload/Runner.app/Frameworks" ]; then
            find Payload/Runner.app/Frameworks -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
            find Payload/Runner.app/Frameworks -name "Headers" -type d -exec rm -rf {} + 2>/dev/null || true
            find Payload/Runner.app/Frameworks -name "PrivateHeaders" -type d -exec rm -rf {} + 2>/dev/null || true
            find Payload/Runner.app/Frameworks -name "Modules" -type d -exec rm -rf {} + 2>/dev/null || true
          fi

          zip -r PrivateCinema.ipa Payload/
          echo "IPA created:"
          ls -lh PrivateCinema.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-cinema-unsigned-ipa
          path: PrivateCinema.ipa
          retention-days: 7
